services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lifehub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../backend/migrations:/docker-entrypoint-initdb.d
    # No "ports:" here on purpose — Postgres is only reachable from other
    # containers on the "internal" network below, never from the host or
    # the public internet.
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/lifehub
      JWT_SECRET: change-this-in-production
      PORT: 4000
      FRONTEND_ORIGIN: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    networks:
      - internal

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:4000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
